<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Mastermind</title>
  <meta name="description" content="Clickable prototype of an event manager for the community team – with fictional demo data.">
  <link rel="icon" type="image/svg+xml" href="bilder/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <div class="kopf-innen">
      <a class="marke" href="#/month">
        <img class="marke-zeichen" src="bilder/favicon.svg" alt="" width="36" height="36">
        <span class="marke-text">
          <strong>Event Mastermind</strong>
          <small>Impact Hub · Community Events</small>
        </span>
      </a>
      <span class="demo-hinweis" title="All data is fictional">Demo · fictional data</span>
      <form class="suche" id="suche-formular" role="search">
        <input type="search" id="suche" placeholder="Search events, tags, places …" aria-label="Search events" autocomplete="off">
      </form>
      <!-- "Ask AI" öffnet die Chat-Schublade (nur online, wenn der Gemini-Schlüssel da ist) -->
      <button class="ki-knopf" id="ki-knopf" type="button" hidden aria-controls="ki-fenster" aria-expanded="false">
        <svg class="funkel" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2.5l1.9 5.6 5.6 1.9-5.6 1.9L10 17.5l-1.9-5.6L2.5 10l5.6-1.9z"/><path d="M18.5 13.5l.95 2.55 2.55.95-2.55.95-.95 2.55-.95-2.55L15 17l2.55-.95z"/></svg> Ask AI
      </button>
      <!-- Benutzer-Menü: wird von app.js gefüllt (E-Mail, Connections) -->
      <div class="benutzer" id="benutzer" hidden></div>
    </div>
    <nav class="hauptnav" aria-label="Views">
      <a href="#/month" data-ansicht="month">Month</a>
      <a href="#/week" data-ansicht="week">Week</a>
      <a href="#/year" data-ansicht="year">Year</a>
      <a href="#/quarter" data-ansicht="quarter">Quarter</a>
      <a href="#/search" data-ansicht="search">List</a>
      <span class="nav-trenner" aria-hidden="true"></span>
      <a href="#/deviations" data-ansicht="deviations">Deviations <span class="zaehler" id="warn-zaehler"></span> <span class="zaehler info" id="info-zaehler"></span></a>
      <a href="#/templates" data-ansicht="templates">Templates</a>
    </nav>
  </header>

  <div class="werkzeugleiste" id="werkzeugleiste">
    <div class="blaettern">
      <button class="knopf rund" id="zurueck" aria-label="Previous">‹</button>
      <h1 id="titel">…</h1>
      <button class="knopf rund" id="vor" aria-label="Next">›</button>
      <!-- Umschalter für die Darstellung (z. B. Calendar | Agenda), wird von app.js gefüllt -->
      <div id="umschalter"></div>
    </div>
    <div class="aktionen">
      <button class="knopf leise" id="heute">Today</button>
      <button class="knopf haupt" id="neues-event">+ New event</button>
    </div>
  </div>

  <main id="inhalt" class="inhalt" tabindex="-1">
    <p class="laedt">Loading data …</p>
  </main>

  <footer class="fuss">
    <span id="datenquelle"></span>
    <button class="knopf leise klein" id="zuruecksetzen">Reset demo data</button>
  </footer>

  <!-- Dialog-Fenster (für Event-Formular, Social-Post usw.) -->
  <dialog id="dialog" class="dialog">
    <div id="dialog-inhalt"></div>
  </dialog>

  <div id="meldung" class="meldung" role="status" aria-live="polite"></div>

  <!-- Event-Details: Schublade, die von rechts hereinfährt (wird von app.js gefüllt) -->
  <div class="drawer-schatten" id="drawer-schatten" hidden></div>
  <aside class="event-drawer" id="event-drawer" hidden tabindex="-1" aria-labelledby="drawer-titel">
    <header class="drawer-kopf">
      <div class="drawer-titel-block">
        <div class="drawer-pillen" id="drawer-pillen"></div>
        <h2 id="drawer-titel"></h2>
        <span class="drawer-datum" id="drawer-datum"></span>
      </div>
    </header>
    <div class="drawer-inhalt" id="drawer-inhalt"></div>
    <!-- Alle Knöpfe der Schublade stehen unten (Ansehen: Aktionen, Close, Edit · Bearbeiten: Delete, Cancel, Save) -->
    <footer class="drawer-fuss" id="drawer-fuss"></footer>
  </aside>

  <!-- "Ask AI": Knopf unten rechts + Chat-Schublade von rechts (nur online; Vorschläge speichert erst ein Klick auf "Apply") -->
  <div class="drawer-schatten ki-schatten" id="ki-schatten" hidden></div>
  <section class="ki-fenster" id="ki-fenster" hidden aria-label="Ask AI">
    <header class="ki-kopf">
      <span class="ki-titel"><svg class="funkel" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2.5l1.9 5.6 5.6 1.9-5.6 1.9L10 17.5l-1.9-5.6L2.5 10l5.6-1.9z"/><path d="M18.5 13.5l.95 2.55 2.55.95-2.55.95-.95 2.55-.95-2.55L15 17l2.55-.95z"/></svg> Ask AI</span>
      <span class="ki-unter">Suggests changes · you decide · answers can be wrong</span>
      <button class="knopf klein leise" id="ki-neu" type="button" title="Clear the chat and start over">↺ New chat</button>
      <button class="knopf rund leise" id="ki-schliessen" type="button" aria-label="Close">×</button>
    </header>
    <div class="ki-verlauf" id="ki-verlauf" aria-live="polite"></div>
    <form class="ki-eingabe" id="ki-formular">
      <textarea id="ki-frage" rows="2" placeholder="Ask a question or ask for texts, e.g. “Write the ticket info for …”" aria-label="Your question"></textarea>
      <button class="knopf haupt" id="ki-senden" type="submit">Send</button>
    </form>
  </section>

  <!-- Reihenfolge wichtig: erst die Daten, dann die Datenschicht, dann die Oberfläche -->
  <script src="data/demo-daten.js"></script>
  <script src="data-layer.js"></script>
  <script src="app.js"></script>
</body>
</html>
