<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Mastermind</title>
  <meta name="description" content="Clickable prototype of an event manager for the community team – with fictional demo data.">
  <link rel="icon" type="image/svg+xml" href="bilder/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <div class="kopf-innen">
      <a class="marke" href="#/year">
        <span class="marke-zeichen" aria-hidden="true">E</span>
        <span class="marke-text">
          <strong>Event Mastermind</strong>
          <small>Impact Hub · Community Events</small>
        </span>
      </a>
      <form class="suche" id="suche-formular" role="search">
        <input type="search" id="suche" placeholder="Search events, tags, places …" aria-label="Search events" autocomplete="off">
      </form>
      <span class="demo-hinweis" title="All data is fictional">Demo · fictional data</span>
      <!-- Benutzer-Menü: wird von app.js gefüllt (nur in der Online-Version mit Google-Login) -->
      <div class="benutzer" id="benutzer" hidden></div>
    </div>
    <nav class="hauptnav" aria-label="Views">
      <a href="#/year" data-ansicht="year">Year</a>
      <a href="#/quarter" data-ansicht="quarter">Quarter</a>
      <a href="#/month" data-ansicht="month">Month</a>
      <a href="#/week" data-ansicht="week">Week</a>
      <span class="nav-trenner" aria-hidden="true"></span>
      <a href="#/search" data-ansicht="search">Search</a>
      <a href="#/deviations" data-ansicht="deviations">Deviations <span class="zaehler" id="warn-zaehler"></span> <span class="zaehler info" id="info-zaehler"></span></a>
      <a href="#/templates" data-ansicht="templates">Templates</a>
      <a href="#/connections" data-ansicht="connections">Connections</a>
    </nav>
  </header>

  <div class="werkzeugleiste" id="werkzeugleiste">
    <div class="blaettern">
      <button class="knopf rund" id="zurueck" aria-label="Previous">‹</button>
      <h1 id="titel">…</h1>
      <button class="knopf rund" id="vor" aria-label="Next">›</button>
    </div>
    <div class="aktionen">
      <button class="knopf leise" id="heute">Today</button>
      <button class="knopf haupt" id="neues-event">+ New event</button>
    </div>
  </div>

  <main id="inhalt" class="inhalt" tabindex="-1">
    <p class="laedt">Loading data …</p>
  </main>

  <footer class="fuss">
    <span id="datenquelle"></span>
    <button class="knopf leise klein" id="zuruecksetzen">Reset demo data</button>
  </footer>

  <!-- Dialog-Fenster (für Event-Formular, Social-Post usw.) -->
  <dialog id="dialog" class="dialog">
    <div id="dialog-inhalt"></div>
  </dialog>

  <div id="meldung" class="meldung" role="status" aria-live="polite"></div>

  <!-- Reihenfolge wichtig: erst die Daten, dann die Datenschicht, dann die Oberfläche -->
  <script src="data/demo-daten.js"></script>
  <script src="data-layer.js"></script>
  <script src="app.js"></script>
</body>
</html>
